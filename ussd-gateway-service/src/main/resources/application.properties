spring.application.name=ussd-gateway-service
server.port=8080

# PostgreSQL database for persisted USSD sessions.
spring.datasource.url=jdbc:postgresql://localhost:5432/ussd_gateway_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

services.bundle-service.url=http://localhost:8081
services.payment-service.url=http://localhost:8082
